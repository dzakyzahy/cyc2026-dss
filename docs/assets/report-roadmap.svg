<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#f8fafc" rx="24"/>
  <rect x="24" y="24" width="1152" height="732" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="16" y="19" font-size="12" font-weight="800" fill="#065f46" letter-spacing="1">GAMBAR 3.1 • 3-PHASE SEQUENCING ROADMAP</text>
    <text x="0" y="60" font-size="28" font-weight="900" fill="#0f172a">Peta Jalan Implementasi 2027–2036 &amp; Tata Kelola KPI PT XYZ</text>
    <text x="0" y="86" font-size="14" font-weight="500" fill="#475569">Penyeimbangan Dampak Iklim × Kelayakan Operasional × Keandalan Pabrik × Daya Saing Bisnis</text>
  </g>

  <!-- 3 Phase Columns -->
  <g transform="translate(56, 165)">
    <!-- Phase 1 -->
    <rect x="0" y="0" width="346" height="475" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect x="20" y="20" width="150" height="26" rx="8" fill="#15803d"/>
    <text x="32" y="38" font-size="12" font-weight="800" fill="#ffffff">FASE 1 • 2027–2028</text>
    <text x="20" y="72" font-size="20" font-weight="900" fill="#14532d">Foundation &amp; Quick Wins</text>
    <text x="20" y="95" font-size="12" font-weight="600" fill="#166534">Reduksi Kumulatif: ~2.450 tCO₂e (-23% Target)</text>
    <line x1="20" y1="110" x2="326" y2="110" stroke="#bbf7d0" stroke-width="1.5"/>

    <g transform="translate(20, 130)" font-size="13" fill="#1e293b">
      <text x="0" y="0" font-weight="800" fill="#15803d">1. Waste Heat Recovery &amp; Boiler Tuning</text>
      <text x="0" y="20" font-size="12" fill="#475569">• Penghematan bahan bakar S1 -16,8% (-659 tCO₂e)</text>
      <text x="0" y="38" font-size="12" fill="#475569">• Payback cepat &lt; 2,2 tahun (CAPEX rendah)</text>

      <text x="0" y="74" font-weight="800" fill="#15803d">2. Smart EMS, Variable Speed Drive &amp; LED</text>
      <text x="0" y="94" font-size="12" fill="#475569">• Efisiensi listrik pabrik -18,0% (-432 tCO₂e)</text>
      <text x="0" y="112" font-size="12" fill="#475569">• Menurunkan beban puncak sebelum PLTS</text>

      <text x="0" y="148" font-weight="800" fill="#15803d">3. PLTS Atap 2,5 MWp On-Site (PPA Zero-Capex)</text>
      <text x="0" y="168" font-size="12" fill="#475569">• Substitusi 45% sisa listrik S2 (-886 tCO₂e)</text>

      <text x="0" y="204" font-weight="800" fill="#15803d">4. Piagam Green Procurement &amp; Audit Pemasok</text>
      <text x="0" y="224" font-size="12" fill="#475569">• Pemetaan data primer Top-20 pemasok Cat 1</text>
      <text x="0" y="242" font-size="12" fill="#475569">• Eliminasi kebocoran refrigeran &amp; limbah S3 Cat 5</text>
    </g>

    <!-- Phase 2 -->
    <rect x="371" y="0" width="346" height="475" rx="16" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="391" y="20" width="150" height="26" rx="8" fill="#0369a1"/>
    <text x="403" y="38" font-size="12" font-weight="800" fill="#ffffff">FASE 2 • 2029–2033</text>
    <text x="391" y="72" font-size="20" font-weight="900" fill="#0c4a6e">Scale &amp; Transformation</text>
    <text x="391" y="95" font-size="12" font-weight="600" fill="#075985">Reduksi Kumulatif: ~8.620 tCO₂e (-83% Target)</text>
    <line x1="391" y1="110" x2="697" y2="110" stroke="#bae6fd" stroke-width="1.5"/>

    <g transform="translate(391, 130)" font-size="13" fill="#1e293b">
      <text x="0" y="0" font-weight="800" fill="#0369a1">5. Co-Firing Biomassa &amp; Industrial Heat Pump</text>
      <text x="0" y="20" font-size="12" fill="#475569">• Dekarbonisasi 60% sisa termal S1 (-1.950 tCO₂e)</text>
      <text x="0" y="38" font-size="12" fill="#475569">• Reduksi otomatis WTT bahan bakar (Cat 3)</text>

      <text x="0" y="74" font-weight="800" fill="#0369a1">6. Kontrak Green Tariff / I-REC Terverifikasi</text>
      <text x="0" y="94" font-size="12" fill="#475569">• Menutup 51,8% sisa listrik S2 (-1.019 tCO₂e)</text>
      <text x="0" y="112" font-size="12" fill="#475569">• Scope 2 turun 97,3% dari baseline 2025</text>

      <text x="0" y="148" font-weight="800" fill="#0369a1">7. S3 Cat 1 Supplier SBTi &amp; Material Daur Ulang</text>
      <text x="0" y="168" font-size="12" fill="#475569">• Substitusi 38% bahan baku rendah karbon (-2.318 tCO₂e)</text>

      <text x="0" y="204" font-weight="800" fill="#0369a1">8. S3 Cat 10 Eco-Design Produk Rendah Suhu</text>
      <text x="0" y="224" font-size="12" fill="#475569">• Reduksi energi pemrosesan hilir -34% (-1.614 tCO₂e)</text>
      <text x="0" y="242" font-size="12" fill="#475569">• Meningkatkan daya saing produk di pasar pelanggan</text>
    </g>

    <!-- Phase 3 -->
    <rect x="742" y="0" width="346" height="475" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <rect x="762" y="20" width="150" height="26" rx="8" fill="#0f766e"/>
    <text x="774" y="38" font-size="12" font-weight="800" fill="#ffffff">FASE 3 • 2034–2036</text>
    <text x="762" y="72" font-size="20" font-weight="900" fill="#134e4a">Target Delivery &amp; Lock-In</text>
    <text x="762" y="95" font-size="12" font-weight="600" fill="#115e59">Reduksi Total: 11.718 tCO₂e (112,5% Target SBTi)</text>
    <line x1="762" y1="110" x2="1068" y2="110" stroke="#99f6e4" stroke-width="1.5"/>

    <g transform="translate(762, 130)" font-size="13" fill="#1e293b">
      <text x="0" y="0" font-weight="800" fill="#0f766e">9. Modal Shift Kereta/Laut &amp; Green 3PL (Cat 4 &amp; 9)</text>
      <text x="0" y="20" font-size="12" fill="#475569">• Dekarbonisasi logistik hulu-hilir -35% (-1.222 tCO₂e)</text>
      <text x="0" y="38" font-size="12" fill="#475569">• Optimasi rute AI &amp; armada truk elektrik/biodiesel B40</text>

      <text x="0" y="74" font-weight="800" fill="#0f766e">10. Elektrifikasi Armada S1 &amp; Shuttle Karyawan</text>
      <text x="0" y="94" font-size="12" fill="#475569">• Konversi EV forklift/truk internal (-185 tCO₂e)</text>
      <text x="0" y="112" font-size="12" fill="#475569">• Program bus listrik komuter Cat 7 (-65 tCO₂e)</text>

      <text x="0" y="148" font-weight="800" fill="#0f766e">11. Digital MRV &amp; Audit Kepatuhan SBTi 2036</text>
      <text x="0" y="168" font-size="12" fill="#475569">• Verifikasi pihak ketiga ISO 14064-1 &amp; pelaporan SRN-PPI</text>
      <text x="0" y="186" font-size="12" fill="#475569">• Buffer keamanan +1.306 tCO₂e di atas syarat SBTi</text>
    </g>
  </g>

  <!-- Footer Governance Bar -->
  <g transform="translate(56, 666)">
    <rect x="0" y="0" width="1088" height="60" rx="12" fill="#0f172a"/>
    <text x="24" y="25" font-size="13" font-weight="800" fill="#34d399">TATA KELOLA &amp; INTERNAL CARBON PRICING (ICP):</text>
    <text x="24" y="45" font-size="12" font-weight="500" fill="#e2e8f0">Penerapan Shadow Carbon Price USD 28/tCO₂e untuk evaluasi CAPEX, Komite Dekarbonisasi Lintas-Fungsi (Operasi, Pengadaan, R&amp;D), dan klausul kontrak pemasok wajib SBTi.</text>
  </g>
</svg>
