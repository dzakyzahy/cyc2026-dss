<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#f8fafc" rx="24"/>
  <rect x="24" y="24" width="1152" height="732" rx="18" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="320" height="28" rx="14" fill="#fef3c7" stroke="#fde68a"/>
    <text x="16" y="19" font-size="12" font-weight="800" fill="#92400e" letter-spacing="1">GAMBAR 4.1 • PRIORITIZATION &amp; MACC MATRIX</text>
    <text x="0" y="60" font-size="28" font-weight="900" fill="#0f172a">Matriks Prioritas Multi-Kriteria (MCDA) &amp; Trade-Off Biaya Abatement</text>
    <text x="0" y="86" font-size="14" font-weight="500" fill="#475569">Evaluasi 8 Dimensi CYC 2026: Potensi Reduksi, Kompleksitas, TRL, Risiko Operasional, Kepentingan Strategis, Skalabilitas, Pemangku Kepentingan, Kecepatan</text>
  </g>

  <!-- Quadrant Plot -->
  <g transform="translate(96, 175)">
    <!-- Quadrant Backgrounds -->
    <rect x="60" y="20" width="460" height="215" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="520" y="20" width="460" height="215" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="60" y="235" width="460" height="215" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="520" y="235" width="460" height="215" fill="#fffbeb" stroke="#fde68a"/>

    <!-- Quadrant Titles -->
    <text x="76" y="46" font-size="12" font-weight="800" fill="#15803d">KUADRAN I: QUICK WINS (Kesiapan Tinggi • Dampak Masif)</text>
    <text x="536" y="46" font-size="12" font-weight="800" fill="#1d4ed8">KUADRAN II: CORE TRANSFORMATION (Investasi Strategis)</text>
    <text x="76" y="436" font-size="12" font-weight="800" fill="#64748b">KUADRAN III: INCREMENTAL HYGIENE (Kepatuhan Rutin)</text>
    <text x="536" y="436" font-size="12" font-weight="800" fill="#b45309">KUADRAN IV: VALUE-CHAIN COLLABORATION (Jangka Panjang)</text>

    <!-- Bubbles (Size = Abatement tCO2e) -->
    <!-- I1: Smart EMS & VFD -->
    <circle cx="170" cy="150" r="24" fill="#0284c7" fill-opacity="0.82" stroke="#0369a1" stroke-width="2"/>
    <text x="170" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#0c4a6e">EMS &amp; VFD (-432 t)</text>

    <!-- I2: Boiler WHR -->
    <circle cx="250" cy="125" r="29" fill="#16a34a" fill-opacity="0.82" stroke="#15803d" stroke-width="2"/>
    <text x="250" y="86" text-anchor="middle" font-size="11" font-weight="800" fill="#14532d">Boiler WHR (-659 t)</text>

    <!-- I3: Rooftop Solar -->
    <circle cx="365" cy="110" r="34" fill="#0284c7" fill-opacity="0.85" stroke="#0369a1" stroke-width="2"/>
    <text x="365" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#0c4a6e">PLTS Atap (-886 t)</text>

    <!-- I4: Green Tariff / I-REC -->
    <circle cx="445" cy="145" r="36" fill="#0ea5e9" fill-opacity="0.85" stroke="#0284c7" stroke-width="2"/>
    <text x="445" y="198" text-anchor="middle" font-size="11" font-weight="800" fill="#0c4a6e">Green Tariff/REC (-1.019 t)</text>

    <!-- I5: Biomass & Heat Pump -->
    <circle cx="625" cy="95" r="46" fill="#15803d" fill-opacity="0.85" stroke="#14532d" stroke-width="2.5"/>
    <text x="625" y="99" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">Biomassa &amp; HP</text>
    <text x="625" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#dcfce7">-1.950 tCO₂e</text>

    <!-- I6: Cat 1 Low Carbon Procurement -->
    <circle cx="795" cy="88" r="52" fill="#0d9488" fill-opacity="0.88" stroke="#115e59" stroke-width="2.5"/>
    <text x="795" y="88" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">Cat 1 Green Supply</text>
    <text x="795" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#ccfbf1">-2.318 tCO₂e</text>

    <!-- I7: Cat 10 Low-Temp Processing Redesign -->
    <circle cx="885" cy="155" r="44" fill="#0f766e" fill-opacity="0.85" stroke="#134e4a" stroke-width="2.5"/>
    <text x="885" y="154" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">Cat 10 Redesign</text>
    <text x="885" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#ccfbf1">-1.614 tCO₂e</text>

    <!-- I8: Green Logistics Cat 4 & 9 -->
    <circle cx="695" cy="295" r="38" fill="#d97706" fill-opacity="0.85" stroke="#92400e" stroke-width="2"/>
    <text x="695" y="299" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">Logistik (-1.222 t)</text>

    <!-- I9: EV Fleet & Commuting -->
    <circle cx="290" cy="315" r="22" fill="#10b981" fill-opacity="0.85" stroke="#047857" stroke-width="2"/>
    <text x="290" y="352" text-anchor="middle" font-size="11" font-weight="800" fill="#065f46">EV Fleet &amp; Bus (-263 t)</text>

    <!-- Axis Labels -->
    <text x="520" y="482" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b">Kompleksitas Implementasi &amp; Ketergantungan Rantai Nilai (Rendah → Tinggi)</text>
    <text x="18" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b" transform="rotate(-90, 18, 235)">Potensi Reduksi Emisi Tahunan (tCO₂e)</text>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(56, 688)">
    <rect x="0" y="0" width="1088" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="27" font-size="12" font-weight="600" fill="#334155">Metodologi MCDA: Skor Komposit = 30% Dampak Reduksi + 20% Kelayakan Teknis (TRL) + 15% Efisiensi Biaya (MACC) + 15% Keandalan Operasi + 10% Kecepatan + 10% Skalabilitas.</text>
  </g>
</svg>
