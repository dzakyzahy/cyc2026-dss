<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="s1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="s2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bgGrad)" rx="24"/>
  <rect x="24" y="24" width="1152" height="732" rx="18" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="16" y="19" font-size="12" font-weight="800" fill="#065f46" letter-spacing="1">GAMBAR 1.1 • GHG BASELINE 2025</text>
    <text x="0" y="60" font-size="28" font-weight="900" fill="#0f172a">Profil Emisi GRK PT XYZ &amp; Batas Target SBTi (26.387,96 tCO₂e)</text>
    <text x="0" y="86" font-size="14" font-weight="500" fill="#475569">Pemetaan Materialitas Scope 1, Scope 2, dan 10 Kategori Scope 3 (In-Boundary 84% vs Out-of-Boundary 16%)</text>
  </g>

  <!-- Summary KPI Cards -->
  <g transform="translate(56, 160)">
    <rect x="0" y="0" width="255" height="104" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="20" y="28" font-size="11" font-weight="800" fill="#15803d" letter-spacing="0.8">SCOPE 1 • DIRECT EMISSIONS</text>
    <text x="20" y="64" font-size="28" font-weight="900" fill="#0f172a">4.152,04 <tspan font-size="14" font-weight="600" fill="#64748b">tCO₂e</tspan></text>
    <text x="20" y="88" font-size="12" font-weight="600" fill="#166534">15,73% Total • 94,1% Stationary Comb.</text>

    <rect x="275" y="0" width="255" height="104" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="295" y="28" font-size="11" font-weight="800" fill="#0369a1" letter-spacing="0.8">SCOPE 2 • PURCHASED ENERGY</text>
    <text x="295" y="64" font-size="28" font-weight="900" fill="#0f172a">2.400,52 <tspan font-size="14" font-weight="600" fill="#64748b">tCO₂e</tspan></text>
    <text x="295" y="88" font-size="12" font-weight="600" fill="#075985">9,10% Total • 100% Market-Based Grid</text>

    <rect x="550" y="0" width="275" height="104" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="570" y="28" font-size="11" font-weight="800" fill="#0f766e" letter-spacing="0.8">SCOPE 3 IN-BOUNDARY (SBTi 84%)</text>
    <text x="570" y="64" font-size="28" font-weight="900" fill="#0f172a">16.756,77 <tspan font-size="14" font-weight="600" fill="#64748b">tCO₂e</tspan></text>
    <text x="570" y="88" font-size="12" font-weight="600" fill="#115e59">Target Reduksi ≥ 6.283,73 tCO₂e (-37,5%)</text>

    <rect x="845" y="0" width="243" height="104" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="865" y="28" font-size="11" font-weight="800" fill="#b45309" letter-spacing="0.8">SCOPE 3 OUT-OF-BOUNDARY</text>
    <text x="865" y="64" font-size="28" font-weight="900" fill="#0f172a">3.078,63 <tspan font-size="14" font-weight="600" fill="#64748b">tCO₂e</tspan></text>
    <text x="865" y="88" font-size="12" font-weight="600" fill="#92400e">Cat 8 &amp; Cat 12 • Dikecualikan SBTi</text>
  </g>

  <!-- Horizontal Bar Breakdown of Major Sources -->
  <g transform="translate(56, 294)">
    <text x="0" y="20" font-size="16" font-weight="800" fill="#0f172a">Peringkat Sumber Emisi (Hotspot Analysis) &amp; Status Batas Target SBTi 2036</text>

    <!-- Row 1: Cat 1 -->
    <g transform="translate(0, 40)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S3 Cat 1 • Purchased Goods &amp; Services</text>
      <rect x="310" y="4" width="520" height="26" rx="6" fill="url(#s3Grad)"/>
      <text x="842" y="22" font-size="13" font-weight="800" fill="#0f172a">6.098,98 tCO₂e (23,1%) • Prioritas #1</text>
    </g>

    <!-- Row 2: Cat 10 -->
    <g transform="translate(0, 82)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S3 Cat 10 • Processing of Sold Product</text>
      <rect x="310" y="4" width="405" height="26" rx="6" fill="url(#s3Grad)"/>
      <text x="727" y="22" font-size="13" font-weight="800" fill="#0f172a">4.745,86 tCO₂e (18,0%) • Prioritas #2</text>
    </g>

    <!-- Row 3: Scope 1 Stationary -->
    <g transform="translate(0, 124)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S1 • Stationary Combustion (Boilers/Furnace)</text>
      <rect x="310" y="4" width="333" height="26" rx="6" fill="url(#s1Grad)"/>
      <text x="655" y="22" font-size="13" font-weight="800" fill="#15803d">3.907,92 tCO₂e (14,8%) • Prioritas #3 (S1)</text>
    </g>

    <!-- Row 4: Cat 12 Out of boundary -->
    <g transform="translate(0, 166)">
      <text x="0" y="22" font-size="13" font-weight="600" fill="#64748b">S3 Cat 12 • End-of-Life Sold Product [Excluded]</text>
      <rect x="310" y="4" width="217" height="26" rx="6" fill="#cbd5e1"/>
      <text x="539" y="22" font-size="13" font-weight="700" fill="#64748b">2.551,06 tCO₂e (9,7%) • Di Luar Target SBTi</text>
    </g>

    <!-- Row 5: Cat 9 -->
    <g transform="translate(0, 208)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S3 Cat 9 • Downstream Transport &amp; Dist.</text>
      <rect x="310" y="4" width="216" height="26" rx="6" fill="url(#s3Grad)"/>
      <text x="538" y="22" font-size="13" font-weight="800" fill="#0f172a">2.532,03 tCO₂e (9,6%) • Logistik Hilir</text>
    </g>

    <!-- Row 6: Scope 2 Electricity -->
    <g transform="translate(0, 250)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S2 • Purchased Electricity (Market-Based)</text>
      <rect x="310" y="4" width="205" height="26" rx="6" fill="url(#s2Grad)"/>
      <text x="527" y="22" font-size="13" font-weight="800" fill="#0369a1">2.400,52 tCO₂e (9,1%) • Quick Win EBT</text>
    </g>

    <!-- Row 7: Cat 3 -->
    <g transform="translate(0, 292)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S3 Cat 3 • Fuel &amp; Energy Related (WTT/T&amp;D)</text>
      <rect x="310" y="4" width="190" height="26" rx="6" fill="url(#s3Grad)"/>
      <text x="512" y="22" font-size="13" font-weight="800" fill="#0f172a">2.227,00 tCO₂e (8,4%) • Co-benefit S1+S2</text>
    </g>

    <!-- Row 8: Cat 4 + Mobile + Commuting + Others -->
    <g transform="translate(0, 334)">
      <text x="0" y="22" font-size="13" font-weight="700" fill="#1e293b">S3 Cat 4 (958,6) + S1 Mobile (231,1) + Lainnya</text>
      <rect x="310" y="4" width="120" height="26" rx="6" fill="#0d9488"/>
      <text x="442" y="22" font-size="13" font-weight="800" fill="#0f172a">1.386,93 tCO₂e (5,3%) • In-Boundary Lainnya</text>
    </g>
  </g>

  <!-- Footer Note -->
  <g transform="translate(56, 706)">
    <rect x="0" y="0" width="1088" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="22" font-size="12" font-weight="600" fill="#334155">Sumber: CYC 2026 Case Study Handbook (Hal. 15–17). Empat hotspot teratas (Cat 1, Cat 10, S1 Stationary, Cat 9) mencakup 74,0% dari seluruh emisi dalam batas target SBTi.</text>
  </g>
</svg>
